<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Dev Container Check Logo</title>
  <desc id="desc">A container-inspired cube with code brackets and a check mark representing verified dev containers.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="cubeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <linearGradient id="checkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g transform="translate(256 256) scale(1.45) translate(-256 -256)">
    <g filter="url(#softShadow)">
      <path d="M256 116 366 178V302L256 364 146 302V178L256 116Z" fill="url(#cubeGrad)"/>
      <path d="M256 116V240L146 178 256 116Z" fill="#67e8f9" fill-opacity="0.35"/>
      <path d="M256 240V364L146 302V178L256 240Z" fill="#0284c7" fill-opacity="0.35"/>
      <path d="M256 240 366 178V302L256 364V240Z" fill="#0369a1" fill-opacity="0.28"/>
    </g>

    <g stroke="#e2e8f0" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
      <path d="M186 214 152 240 186 266"/>
      <path d="M326 214 360 240 326 266"/>
    </g>

    <circle cx="338" cy="336" r="64" fill="#0b1220" stroke="#1f2937" stroke-width="10"/>
    <path d="M308 336 331 359 370 318" fill="none" stroke="url(#checkGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
