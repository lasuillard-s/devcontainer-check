name: Dev Container Check
run-name: Check ${{ inputs.owner }}/${{ inputs.repo }}@${{ inputs.sha }}

on:
  # Testing workflow dispatches for non-default branch with GitHub CLI:
  #   `echo '{"owner": "<OWNER>", "repo": "<REPO>", "sha": "<SHA>"}' | gh workflow run devcontainer-check.yaml --ref <BRANCH> --json`
  workflow_dispatch:
    inputs:
      owner:
        description: Owner of the repository to check dev container configuration for
        type: string
        required: true

      repo:
        description: Repository to check dev container configuration for
        type: string
        required: true

      sha:
        description: Commit SHA to check
        type: string
        required: true

concurrency:
  # Single workflow run per repository/SHA
  group: |-
    ${{ github.workflow }}|${{ inputs.owner }}/${{ inputs.repo }}@${{ inputs.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CHECK_RESULT: .devcontainer-check/result.json
      CHECK_RESULT_DIR: .devcontainer-check
    steps:
      # Save the workflow inputs as an artifact for use on workflow completion event
      # (see src/handlers/workflow_run.completed.ts)
      - name: Save workflow inputs
        run: echo '${{ toJSON(inputs) }}' > inputs.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-inputs
          path: inputs.json
          retention-days: 1

      # Main logic of the workflow to check for dev container configuration
      - name: Install devcontainer CLI
        run: npm install --global @devcontainers/cli@0.87.0

      - name: Install check-jsonschema CLI
        run: pip install "check-jsonschema==0.37.2"

      - name: Get application token
        id: get-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          private-key: ${{ secrets.PRIVATE_KEY }}
          client-id: ${{ secrets.APP_ID }}
          owner: ${{ inputs.owner }}
          repositories: ${{ inputs.repo }}

      - name: Checkout
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.owner }}/${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          token: ${{ steps.get-token.outputs.token }}
          fetch-depth: 1 # Only fetch the latest commit to speed up the workflow

      # Calculate hash of devcontainer configuration
      - name: Check dev container configuration
        id: resolve-config
        # outputs: using-devcontainer
        run: |
          if [ -d '.devcontainer' ]; then
            echo 'Found .devcontainer directory, using it as the dev container configuration.'
            echo 'using-devcontainer=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -d '.devcontainer.example' ]; then
            echo 'Found .devcontainer.example directory, using it as the dev container configuration.'
            cp --recursive .devcontainer.example .devcontainer
            echo 'using-devcontainer=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'No dev container configuration found in the repository.'
          echo 'using-devcontainer=false' >> "$GITHUB_OUTPUT"

      - name: Calculate hash of dev container configuration
        id: hash-config
        if: steps.resolve-config.outputs.using-devcontainer == 'true'
        timeout-minutes: 5
        shell: bash
        # outputs: config-hash
        run: |
          echo "::group::Calculating hash of dev container configuration"
          config="$( \
            devcontainer read-configuration \
              --workspace-folder . \
              --include-features-configuration \
              --include-merged-configuration \
          )"
          echo "Raw dev container configuration:"
          echo "$config"
          echo "::endgroup::"

          echo "::group::Sanitizing dev container configuration for hashing"
          sanitized_config="$( \
            echo "$config" \
            | jq --compact-output --sort-keys '
              del(
                .workspace.workspaceFolder,
                .workspace.workspaceMount,
                .configuration.configFilePath,
                .featuresConfiguration.dstFolder,
                .featuresConfiguration.featureSets[].features[].cachePath,
                .mergedConfiguration.configFilePath
              )' \
            )"
          echo "Sanitized dev container configuration:"
          echo "$sanitized_config"
          echo "::endgroup::"

          echo "::group::Calculating hash of sanitized dev container configuration"
          config_hash="$( \
            echo "$sanitized_config" \
            | sha256sum \
            | awk '{print $1}' \
          )"
          echo "Calculated configuration hash: $config_hash"
          echo "::endgroup::"

          echo "::group::Exporting output variables"
          echo "config-hash=${config_hash}" | tee --append "$GITHUB_OUTPUT"
          if [ -z "$config_hash" ]; then
            echo "Failed to calculate configuration hash. The dev container configuration might be invalid."
            exit 1
          fi
          echo "::endgroup::"

      # Restore previous check result from cache and re-use it
      - name: Restore previous check result from cache
        id: cache
        if: steps.resolve-config.outputs.using-devcontainer == 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: check-result-${{ inputs.owner }}-${{ inputs.repo }}-${{
            steps.hash-config.outputs.config-hash }}
          path: ${{ env.CHECK_RESULT_DIR }}

      - name: Re-use cached result if valid
        id: cached-result
        if: |
          steps.resolve-config.outputs.using-devcontainer == 'true'
          && steps.cache.outputs.cache-hit == 'true'
        # outputs: reused
        run: |
          echo "Cache hit for dev container configuration. Validating cached result..."
          if [ ! -f "$CHECK_RESULT" ]; then
            echo "Cached result file is missing. Falling back to a fresh check."
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          success=$(jq -er '.success | select(type == "boolean")' "$CHECK_RESULT" 2>/dev/null || true)
          if [ -z "$success" ]; then
            echo "Cached result is malformed. Falling back to a fresh check."
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Cached result is valid. Re-using previous result."
          echo ""
          cat "$CHECK_RESULT"
          echo ""
          echo "reused=true" >> "$GITHUB_OUTPUT"

          if [ "$success" = "true" ]; then
            echo "Previous check was successful."
            exit 0
          else
            echo "Previous check was unsuccessful."
            exit 1
          fi

      # Cache miss - check the dev container configuration and cache the result
      - name: Check for dev container health
        id: health-check
        if: |
          steps.resolve-config.outputs.using-devcontainer == 'true'
          && steps.cached-result.outputs.reused != 'true'
        timeout-minutes: 15
        run: |
          echo "::group::Validating dev container configuration schema"
          echo 'Validating devcontainer configuration against schema...'
          schema_sha='c95ffeed1d059abfe9ffbe79762dc2fa4e7c2421' # Mar 20, 2026
          check-jsonschema \
            --schemafile "https://raw.githubusercontent.com/devcontainers/spec/${schema_sha}/schemas/devContainer.schema.json" \
            .devcontainer/devcontainer.json
          echo "::endgroup::"

          echo "::group::Building and starting dev container"
          echo 'Building and starting dev container...'
          devcontainer build --workspace-folder .
          devcontainer up --workspace-folder .
          echo "::endgroup::"

          echo "::group::Running health check command in dev container"
          echo 'Running health check command in dev container...'
          devcontainer exec --workspace-folder . -- bash -c 'echo "Dev container is running successfully." || exit 1'
          echo "::endgroup::"

      # On check was successful
      - name: Write successful check result with jq
        id: write-success-result
        if: |
          always()
          && steps.resolve-config.outputs.using-devcontainer == 'true'
          && steps.cached-result.outputs.reused != 'true'
          && steps.health-check.outcome == 'success'
        run: |
          mkdir --parents "$CHECK_RESULT_DIR"
          jq --null-input \
            --arg owner '${{ inputs.owner }}' \
            --arg repo '${{ inputs.repo }}' \
            --arg sha '${{ inputs.sha }}' \
            --arg configHash '${{ steps.hash-config.outputs.config-hash }}' \
            --arg checkedAt "$(date --utc +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              success: true,
              owner: $owner,
              repo: $repo,
              sha: $sha,
              configHash: $configHash,
              checkedAt: $checkedAt
            }' > "$CHECK_RESULT"

      # On check was failure
      - name: Write failed check result with jq
        id: write-failed-result
        if: |
          always()
          && steps.resolve-config.outputs.using-devcontainer == 'true'
          && steps.cached-result.outputs.reused != 'true'
          && steps.health-check.outcome == 'failure'
        run: |
          mkdir --parents "$CHECK_RESULT_DIR"
          jq --null-input \
            --arg owner '${{ inputs.owner }}' \
            --arg repo '${{ inputs.repo }}' \
            --arg sha '${{ inputs.sha }}' \
            --arg configHash '${{ steps.hash-config.outputs.config-hash }}' \
            --arg checkedAt "$(date --utc +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              success: false,
              owner: $owner,
              repo: $repo,
              sha: $sha,
              configHash: $configHash,
              checkedAt: $checkedAt
            }' > "$CHECK_RESULT"

      - name: Save check result to cache
        if: |
          always()
          && steps.resolve-config.outputs.using-devcontainer == 'true'
          && steps.cached-result.outputs.reused != 'true'
          && (steps.write-success-result.outcome == 'success' || steps.write-failed-result.outcome == 'success')
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: check-result-${{ inputs.owner }}-${{ inputs.repo }}-${{
            steps.hash-config.outputs.config-hash }}
          path: ${{ env.CHECK_RESULT_DIR }}
