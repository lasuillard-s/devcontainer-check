name: Check Dev Container

on:
  workflow_dispatch:
    inputs:
      owner:
        description: Owner of the repository to check dev container configuration for
        type: string
        required: true

      repo:
        description: Repository to check dev container configuration for
        type: string
        required: true

      ref:
        description: Branch, tag or commit SHA to check (defaults to the default branch)
        type: string
        required: false
        default: ""

concurrency:
  # Single workflow run per repository/branch
  group: ${{ github.workflow }}/${{ inputs.owner }}/${{ inputs.repo }}@${{ inputs.ref || 'default-branch' }}
  cancel-in-progress: true

jobs:
  dev-container-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Save workflow inputs
        run: echo '${{ toJSON(inputs) }}' > inputs.json

      - uses: actions/upload-artifact@v7
        with:
          name: workflow-inputs
          path: inputs.json
          retention-days: 1

      - name: Get application token
        id: get-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3
        with:
          private-key: ${{ secrets.PRIVATE_KEY }}
          app-id: ${{ secrets.APP_ID }}
          owner: ${{ inputs.owner }}
          repositories: ${{ inputs.repo }}

      - name: Checkout ${{ inputs.owner }}/${{ inputs.repo }} (${{ inputs.ref || 'default branch' }})
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ${{ inputs.owner }}/${{ inputs.repo }}
          ref: ${{ inputs.ref || '' }}
          token: ${{ steps.get-token.outputs.token }}
          fetch-depth: 1 # Only fetch the latest commit to speed up the workflow

      - name: Define target repository context as environment variable
        run: |
          # Target repository owner
          echo "TARGET_OWNER=${{ inputs.owner }}" >> $GITHUB_ENV

          # Target repository name (without owner)
          echo "TARGET_REPOSITORY=${{ inputs.repo }}" >> $GITHUB_ENV

          # Latest commit SHA of the checked-out branch
          echo "COMMIT_SHA=${{ steps.checkout.outputs.commit }}" >> $GITHUB_ENV

          # URL of the current workflow run, used for commit status target_url
          # * Runner repository may be private so the URL may not be accessible to everyone
          echo "WORKFLOW_RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV

      - name: Check dev container configuration
        id: check-dev-container
        run: |
          if [ -d '.devcontainer' ]; then
            echo 'Found .devcontainer directory, using it as the dev container configuration.'
            echo 'using-dev-container=true' >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ -d '.devcontainer.example' ]; then
            echo 'Found .devcontainer.example directory, using it as the dev container configuration.'
            cp --recursive .devcontainer.example .devcontainer
            echo 'using-dev-container=true' >> $GITHUB_OUTPUT
            exit 0
          fi
          echo 'No dev container configuration found in the repository.'
          echo 'using-dev-container=false' >> $GITHUB_OUTPUT

      - name: Set commit status to pending
        if: ${{ steps.check-dev-container.outputs.using-dev-container == 'true' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ steps.get-token.outputs.token }}
          script: |
            const { repo } = context;
            await github.rest.repos.createCommitStatus({
              owner: process.env.TARGET_OWNER,
              repo: process.env.TARGET_REPOSITORY,
              sha: process.env.COMMIT_SHA,
              state: 'pending',
              context: 'Dev Container Check',
              description: 'Checking for dev container configuration...',
              target_url: process.env.WORKFLOW_RUN_URL
            });

      - name: Check for dev container configuration
        if: ${{ steps.check-dev-container.outputs.using-dev-container == 'true' }}
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3
        timeout-minutes: 15
        with:
          runCmd: echo "Dev container is running successfully."
          push: never

      - name: Set commit status to success
        if: ${{ steps.check-dev-container.outputs.using-dev-container == 'true' && success() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ steps.get-token.outputs.token }}
          script: |
            const { repo } = context;
            await github.rest.repos.createCommitStatus({
              owner: process.env.TARGET_OWNER,
              repo: process.env.TARGET_REPOSITORY,
              sha: process.env.COMMIT_SHA,
              state: 'success',
              context: 'Dev Container Check',
              description: 'Dev container configuration is valid.',
              target_url: process.env.WORKFLOW_RUN_URL
            });

      - name: Set commit status to failure
        if: ${{ steps.check-dev-container.outputs.using-dev-container == 'true' && failure() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ steps.get-token.outputs.token }}
          script: |
            const { repo } = context;
            await github.rest.repos.createCommitStatus({
              owner: process.env.TARGET_OWNER,
              repo: process.env.TARGET_REPOSITORY,
              sha: process.env.COMMIT_SHA,
              state: 'failure',
              context: 'Dev Container Check',
              description: 'Dev container configuration is invalid.',
              target_url: process.env.WORKFLOW_RUN_URL
            });
