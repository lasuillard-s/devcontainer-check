name: Devcontainer Check
run-name: Check ${{ inputs.owner }}/${{ inputs.repo }}@${{ inputs.sha }}

on:
  # Testing workflow dispatches for non-default branch with GitHub CLI:
  #   `echo '{"owner": "<OWNER>", "repo": "<REPO>", "sha": "<SHA>"}' | gh workflow run devcontainer-check.yaml --ref <BRANCH> --json`
  workflow_dispatch:
    inputs:
      owner:
        description: Owner of the repository to check dev container configuration for
        type: string
        required: true

      repo:
        description: Repository to check dev container configuration for
        type: string
        required: true

      sha:
        description: Commit SHA to check
        type: string
        required: true

  # NOTE: This workflow call trigger is intended to be used in other workflows for testing rather than for reuse.
  workflow_call:
    inputs:
      # The source of the workflow call to distinguish between workflow_dispatch and workflow_call
      source:
        description: Source of the workflow call
        type: string
        required: false
        default: workflow_call

      owner:
        description: Owner of the repository to check dev container configuration for
        type: string
        required: true

      repo:
        description: Repository to check dev container configuration for
        type: string
        required: true

      sha:
        description: Commit SHA to check
        type: string
        required: true

      no-cached-result:
        description: Do not use cached result. It does not disable cache operations.
        type: boolean
        required: false

concurrency:
  # Single workflow run per caller repository/SHA. github.repository refers to
  # the caller (e.g. a fork), so shared fixtures don't cancel each other's runs.
  group: |-
    ${{ github.repository }}:${{ github.ref }}:${{ github.workflow }}|${{ inputs.owner }}/${{ inputs.repo }}@${{ inputs.sha }}
  cancel-in-progress: true

# NOTE: RUNNER_TEMP variable reference: https://docs.github.com/en/actions/reference/workflows-and-actions/variables

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TESTING: ${{ inputs.source == 'workflow_call' }}
      CHECK_RESULT: .devcontainer-check/result.json
      CHECK_RESULT_DIR: .devcontainer-check
    defaults:
      run:
        # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#defaultsrunshell
        shell: bash
    steps:
      # Save the workflow inputs as an artifact for use on workflow completion event
      # (see src/event-handlers/workflow_run.completed.ts)
      - name: Save workflow inputs
        run: echo '${{ toJSON(inputs) }}' > inputs.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: ${{ env.TESTING == 'true'}} # Ignore conflicts if artifact already exists when testing with workflow_call
        with:
          name: workflow-inputs
          path: inputs.json
          retention-days: 1

      # Main logic of the workflow to check for dev container configuration
      - name: Install devcontainer CLI
        run: npm install --global @devcontainers/cli@0.89.0

      - name: Install check-jsonschema CLI
        run: pip install "check-jsonschema==0.38.2"

      - name: Get application token
        id: get-token
        if: ${{ env.TESTING != 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          private-key: ${{ secrets.DEVCONTAINER_CHECK_PRIVATE_KEY || secrets.PRIVATE_KEY }}
          client-id: ${{ secrets.DEVCONTAINER_CHECK_APP_ID || secrets.APP_ID }}
          owner: ${{ inputs.owner }}
          repositories: ${{ inputs.repo }}

      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.owner }}/${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          token: ${{ steps.get-token.outputs.token || github.token }}
          fetch-depth: 1 # Only fetch the latest commit to speed up the workflow

      # Resolve which dev container configuration to use
      - name: Resolve dev container configuration
        id: resolve-config
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            if (fs.existsSync('.devcontainer')) {
              core.info('Found .devcontainer directory, using it as the dev container configuration.');
              core.setOutput('using-devcontainer', 'true');
              return;
            }
            if (fs.existsSync('.devcontainer.example')) {
              core.info('Found .devcontainer.example directory, using it as the dev container configuration.');
              fs.cpSync('.devcontainer.example', '.devcontainer', { recursive: true });
              core.setOutput('using-devcontainer', 'true');
              return;
            }
            core.info('No dev container configuration found in the repository.');
            core.setOutput('using-devcontainer', 'false');

      # Read the raw dev container configuration (requires Docker)
      - name: Read dev container configuration
        id: read-config
        if: steps.resolve-config.outputs.using-devcontainer == 'true'
        timeout-minutes: 5
        run: |
          devcontainer read-configuration \
            --workspace-folder . \
            --include-features-configuration \
            --include-merged-configuration \
            > "${RUNNER_TEMP}/devcontainer-config.json"

      # Calculate a stable hash of the (sanitized) dev container configuration
      - name: Calculate hash of dev container configuration
        id: hash-config
        if: |
          steps.resolve-config.outputs.using-devcontainer == 'true'
          && steps.read-config.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');

            const { RUNNER_TEMP } = process.env;
            const configPath = `${RUNNER_TEMP}/devcontainer-config.json`;

            // Sort keys to ensure the same configuration always produces the same hash
            const stableStringify = (value) => {
              if (value === null || typeof value !== 'object') return value;
              if (Array.isArray(value)) return value.map(stableStringify);
              const sorted = {};
              for (const key of Object.keys(value).sort()) {
                sorted[key] = stableStringify(value[key]);
              }
              return sorted;
            };

            // Remove unstable parts of the dev container configuration
            const sanitize = (config) => {
              if (!config || typeof config !== 'object') return config;
              delete config.workspace?.workspaceFolder;
              delete config.workspace?.workspaceMount;
              delete config.configuration?.configFilePath;
              delete config.featuresConfiguration?.dstFolder;
              for (const set of config.featuresConfiguration?.featureSets ?? []) {
                for (const feature of set?.features ?? []) delete feature.cachePath;
              }
              delete config.mergedConfiguration?.configFilePath;
              return config;
            };

            // Read and parse the dev container configuration
            core.info(`Reading dev container configuration from ${configPath}`);
            let config;
            try {
              config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
            } catch (error) {
              core.setFailed(`Failed to parse dev container configuration: ${error.message}`);
              return;
            }

            // Calculate the configuration hash
            const stableConfig = stableStringify(sanitize(config));
            core.debug(`Stable dev container configuration: ${JSON.stringify(stableConfig, null, 2)}`);

            const serialized = JSON.stringify(stableConfig, null, 2);
            core.debug(`Serialized dev container configuration: ${serialized}`);

            const configHash = crypto.createHash('sha256').update(serialized).digest('hex');
            if (!configHash) {
              core.setFailed('Failed to calculate configuration hash. The dev container configuration might be invalid.');
              return;
            }
            core.info(`Configuration hash: ${configHash}`);

            // Collect all relevant files that the Dev Container configuration relies on
            const getFilesInDir = (dir) => {
              const results = [];
              if (!fs.existsSync(dir)) return results;
              const list = fs.readdirSync(dir, { withFileTypes: true });
              for (const dirent of list) {
                const fullPath = path.join(dir, dirent.name);
                try {
                  const stat = fs.statSync(fullPath);
                  if (stat.isDirectory()) {
                    results.push(...getFilesInDir(fullPath));
                  } else if (stat.isFile()) {
                    results.push(path.relative('.', fullPath).split(path.sep).join('/'));
                  }
                } catch {}
              }
              return results;
            };

            const filesSet = new Set();
            const devcontainerDir = '.devcontainer';
            const devcontainerFiles = getFilesInDir(devcontainerDir);
            for (const file of devcontainerFiles) {
              // Exclude devcontainer.json as it is already covered by sanitized configHash
              if (!file.endsWith('/devcontainer.json') && file !== 'devcontainer.json' && file !== '.devcontainer.json') {
                filesSet.add(file);
              }
            }

            const checkAndAdd = (targetPath) => {
              if (!targetPath || typeof targetPath !== 'string') return;
              try {
                const resolved = path.resolve(targetPath);
                const relative = path.relative('.', resolved).split(path.sep).join('/');
                if (!relative.startsWith('..') && fs.existsSync(resolved) && fs.statSync(resolved).isFile()) {
                  if (!relative.endsWith('/devcontainer.json') && relative !== 'devcontainer.json' && relative !== '.devcontainer.json') {
                    filesSet.add(relative);
                  }
                }
              } catch {}
            };

            const extractTokens = (val) => {
              if (!val) return;
              if (typeof val === 'string') {
                for (const token of val.split(/\s+/)) {
                  const cleaned = token.replace(/^['"]|['"]$/g, '');
                  checkAndAdd(path.join(devcontainerDir, cleaned));
                  checkAndAdd(cleaned);
                }
              } else if (Array.isArray(val)) {
                for (const item of val) extractTokens(item);
              } else if (typeof val === 'object') {
                for (const item of Object.values(val)) extractTokens(item);
              }
            };

            const cfg = config.configuration ?? {};
            const merged = config.mergedConfiguration ?? {};

            // Dockerfile references
            const dockerfile = cfg.build?.dockerfile ?? merged.build?.dockerfile ?? cfg.dockerFile ?? merged.dockerFile;
            const context = cfg.build?.context ?? merged.build?.context ?? cfg.context ?? merged.context;
            if (dockerfile) {
              if (context) checkAndAdd(path.join(devcontainerDir, context, dockerfile));
              checkAndAdd(path.join(devcontainerDir, dockerfile));
              checkAndAdd(dockerfile);
            }

            // Docker Compose file references
            const composeFiles = cfg.dockerComposeFile ?? merged.dockerComposeFile;
            if (composeFiles) {
              const list = Array.isArray(composeFiles) ? composeFiles : [composeFiles];
              for (const file of list) {
                checkAndAdd(path.join(devcontainerDir, file));
                checkAndAdd(file);
              }
            }

            // Lifecycle command scripts
            const lifecycleValues = [
              cfg.initializeCommand,
              merged.initializeCommand,
              cfg.onCreateCommand,
              merged.onCreateCommands,
              cfg.updateContentCommand,
              merged.updateContentCommands,
              cfg.postCreateCommand,
              merged.postCreateCommands,
              cfg.postStartCommand,
              merged.postStartCommands,
              cfg.postAttachCommand,
              merged.postAttachCommands,
            ];
            for (const cmd of lifecycleValues) {
              extractTokens(cmd);
            }

            // Mounts (bind mounts pointing to local workspace files)
            const mounts = cfg.mounts ?? merged.mounts ?? [];
            for (const mount of mounts) {
              if (typeof mount === 'string') {
                const match = mount.match(/source=([^,]+)/);
                if (match) {
                  const src = match[1].replace(/\$\{localWorkspaceFolder\}|\$\{workspaceFolder\}/g, '.');
                  checkAndAdd(src);
                }
              } else if (mount && typeof mount === 'object' && mount.source) {
                const src = mount.source.replace(/\$\{localWorkspaceFolder\}|\$\{workspaceFolder\}/g, '.');
                checkAndAdd(src);
              }
            }

            // Dev container lockfile references
            checkAndAdd(path.join(devcontainerDir, 'devcontainer-lock.json'));
            checkAndAdd('devcontainer-lock.json');
            checkAndAdd('.devcontainer-lock.json');

            // Calculate hash of relevant files sorted in lexicographical order
            const sortedFiles = Array.from(filesSet).sort((a, b) => a.localeCompare(b));
            core.info(`Found ${sortedFiles.length} relevant files for hashing: ${JSON.stringify(sortedFiles)}`);

            const fileEntries = [];
            for (const fileName of sortedFiles) {
              const fileContent = fs.readFileSync(fileName);
              const fileHash = crypto.createHash('sha256').update(fileContent).digest('hex');
              fileEntries.push(`${fileName}:${fileHash}`);
            }

            const filesString = fileEntries.join('&');
            const filesHash = crypto.createHash('sha256').update(filesString).digest('hex');
            core.info(`Files hash: ${filesHash}`);

            // Calculate final chained hash: hash(hash(configuration) + hash(files))
            const finalHash = crypto.createHash('sha256').update(configHash + filesHash).digest('hex');
            core.info(`Final chained hash: ${finalHash}`);

            core.setOutput('config-hash', finalHash);

      # Restore previous check result from cache and re-use it
      - name: Restore previous check result from cache
        id: cache
        if: steps.resolve-config.outputs.using-devcontainer == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: check-result-${{ inputs.owner }}-${{ inputs.repo }}-${{
            steps.hash-config.outputs.config-hash }}
          path: ${{ env.CHECK_RESULT_DIR }}

      # Validate a restored result and re-use it when valid
      - name: Re-use cached result if valid
        id: cached-result
        if: |
          steps.resolve-config.outputs.using-devcontainer == 'true'
          && steps.cache.outputs.cache-hit == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NO_CACHED_RESULT: ${{ inputs.no-cached-result }}
        with:
          script: |
            const fs = require('node:fs');
            const { CHECK_RESULT, NO_CACHED_RESULT } = process.env;

            if (!fs.existsSync(CHECK_RESULT)) {
              core.warning('Cached result file is missing. Falling back to a fresh check.');
              core.setOutput('reused', 'false');
              return;
            }

            let result;
            try {
              result = JSON.parse(fs.readFileSync(CHECK_RESULT, 'utf8'));
            } catch (error) {
              core.warning(`Cached result is malformed (${error.message}). Falling back to a fresh check.`);
              core.setOutput('reused', 'false');
              return;
            }

            if (typeof result?.success !== 'boolean') {
              core.warning('Cached result is malformed. Falling back to a fresh check.');
              core.setOutput('reused', 'false');
              return;
            }

            if (NO_CACHED_RESULT) {
              core.info('Cached result is valid, but the "no-cached-result" input is set. Falling back to a fresh check.');
              core.setOutput('reused', 'false');
              return;
            }

            core.info('Cached result is valid. Re-using previous result.');
            core.setOutput('reused', 'true');
            if (!result.success) {
              core.setFailed('Previous check was unsuccessful.');
            }

      # Cache miss - check the dev container configuration and cache the result
      - name: Check for dev container health
        id: health-check
        if: |
          steps.resolve-config.outputs.using-devcontainer == 'true'
          && steps.cached-result.outputs.reused != 'true'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: ${{ env.TESTING == 'true' && 3 || 1 }}
          shell: bash
          command: |
            set -o errexit
            set -o nounset
            set -o pipefail

            echo 'Validating devcontainer configuration against schema...'
            schema_sha='c95ffeed1d059abfe9ffbe79762dc2fa4e7c2421' # Mar 20, 2026
            check-jsonschema \
              --schemafile "https://raw.githubusercontent.com/devcontainers/spec/${schema_sha}/schemas/devContainer.schema.json" \
              .devcontainer/devcontainer.json

            echo 'Building and starting dev container...'
            devcontainer build --workspace-folder .
            devcontainer up --workspace-folder .

            echo 'Running health check command in dev container...'
            devcontainer exec --workspace-folder . -- bash -c 'echo "Dev container is running successfully." || exit 1'

      # Write the check result for both success and failure outcomes
      - name: Write check result
        id: write-result
        if: |
          always()
          && steps.resolve-config.outputs.using-devcontainer == 'true'
          && steps.hash-config.outcome == 'success'
          && steps.cached-result.outputs.reused != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT_OWNER: ${{ inputs.owner }}
          RESULT_REPO: ${{ inputs.repo }}
          RESULT_SHA: ${{ inputs.sha }}
          RESULT_CONFIG_HASH: ${{ steps.hash-config.outputs.config-hash }}
          RESULT_HEALTH_OUTCOME: ${{ steps.health-check.outcome }}
        with:
          script: |
            const fs = require('node:fs');

            const {
              CHECK_RESULT,
              CHECK_RESULT_DIR,
              RESULT_OWNER,
              RESULT_REPO,
              RESULT_SHA,
              RESULT_CONFIG_HASH,
              RESULT_HEALTH_OUTCOME,
            } = process.env;

            fs.mkdirSync(CHECK_RESULT_DIR, { recursive: true });

            const result = {
              success: RESULT_HEALTH_OUTCOME === 'success',
              owner: RESULT_OWNER,
              repo: RESULT_REPO,
              sha: RESULT_SHA,
              configHash: RESULT_CONFIG_HASH,
              checkedAt: new Date().toISOString()
            };
            fs.writeFileSync(CHECK_RESULT, JSON.stringify(result, null, 2));
            core.info(`Wrote check result (success=${result.success})`);

      - name: Save check result to cache
        if: |
          always()
          && steps.resolve-config.outputs.using-devcontainer == 'true'
          && steps.cached-result.outputs.reused != 'true'
          && steps.write-result.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: check-result-${{ inputs.owner }}-${{ inputs.repo }}-${{
            steps.hash-config.outputs.config-hash }}
          path: ${{ env.CHECK_RESULT_DIR }}
