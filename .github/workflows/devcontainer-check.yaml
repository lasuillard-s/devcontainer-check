name: Dev Container Check
run-name: Check ${{ inputs.owner }}/${{ inputs.repo }}@${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      owner:
        description: Owner of the repository to check dev container configuration for
        type: string
        required: true

      repo:
        description: Repository to check dev container configuration for
        type: string
        required: true

      sha:
        description: Commit SHA to check
        type: string
        required: true

concurrency:
  # Single workflow run per repository/branch
  group: ${{ github.workflow }}|${{ inputs.owner }}/${{ inputs.repo }}@${{ inputs.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Save the workflow inputs as an artifact to use when workflow completion event is received
      - name: Save workflow inputs
        run: echo '${{ toJSON(inputs) }}' > inputs.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workflow-inputs
          path: inputs.json
          retention-days: 1

      # Main logic of the workflow to check for dev container configuration
      - name: Install devcontainer and ajv CLI
        run: npm install --global @devcontainers/cli@0.86.0 ajv-cli@5.0.0

      - name: Get application token
        id: get-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          private-key: ${{ secrets.PRIVATE_KEY }}
          client-id: ${{ secrets.APP_ID }}
          owner: ${{ inputs.owner }}
          repositories: ${{ inputs.repo }}

      - name: Checkout
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ${{ inputs.owner }}/${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          token: ${{ steps.get-token.outputs.token }}
          fetch-depth: 1 # Only fetch the latest commit to speed up the workflow

      - name: Check dev container configuration
        id: check-dev-container
        run: |
          if [ -d '.devcontainer' ]; then
            echo 'Found .devcontainer directory, using it as the dev container configuration.'
            echo 'using-dev-container=true' >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ -d '.devcontainer.example' ]; then
            echo 'Found .devcontainer.example directory, using it as the dev container configuration.'
            cp --recursive .devcontainer.example .devcontainer
            echo 'using-dev-container=true' >> $GITHUB_OUTPUT
            exit 0
          fi
          echo 'No dev container configuration found in the repository.'
          echo 'using-dev-container=false' >> $GITHUB_OUTPUT

      - name: Validate dev container configuration JSON schema
        if: ${{ steps.check-dev-container.outputs.using-dev-container == 'true' }}
        run: |
          schema_sha='c95ffeed1d059abfe9ffbe79762dc2fa4e7c2421'
          echo "Downloading devcontainer schema... (${schema_sha} for Mar 20, 2026)"
          curl --fail --silent --show-error --location --output /tmp/devContainer.schema.json "https://raw.githubusercontent.com/devcontainers/spec/${schema_sha}/schemas/devContainer.schema.json"

          echo 'Reading devcontainer configuration...'
          devcontainer read-configuration --workspace-folder . --include-features-configuration --include-merged-configuration 1>/tmp/devcontainer-config.json

          echo 'Validating devcontainer configuration against schema...'
          ajv -s /tmp/devContainer.schema.json -d /tmp/devcontainer-config.json

      - name: Check for dev container configuration
        if: ${{ steps.check-dev-container.outputs.using-dev-container == 'true' }}
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3
        timeout-minutes: 15
        with:
          runCmd: echo "Dev container is running successfully."
          push: never
